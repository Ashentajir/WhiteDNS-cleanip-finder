name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    uses: ./.github/workflows/build-desktop.yml
  android:
    uses: ./.github/workflows/build-apk.yml
    secrets: inherit
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify artifacts and create checksums
        shell: bash
        run: |
          test -s dist/whitedns-windows-amd64.exe
          test -s dist/whitedns-linux-amd64
          test -s dist/whitedns-linux-arm64
          test -s dist/whitedns-termux-arm64
          test -s dist/whitedns-macos-amd64
          test -s dist/whitedns-macos-arm64
          compgen -G 'dist/*.apk' >/dev/null
          compgen -G 'dist/*.aab' >/dev/null
          (cd dist && sha256sum * > SHA256SUMS.txt)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --title "WhiteDNS $RELEASE_TAG" --notes-file docs/release-notes.md
          fi